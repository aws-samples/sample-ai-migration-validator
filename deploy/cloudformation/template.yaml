AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Migration Validator — least-privilege IAM, Secrets Manager scaffolding, and
  optional private-VPC infrastructure with interface endpoints for Bedrock
  and Secrets Manager so the validator never reaches AWS APIs over the
  public internet.

Parameters:
  ProjectName:
    Type: String
    Default: migration-validator
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
    Description: Lowercase prefix for all created resources.

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: >
      Bedrock model or inference profile id. The IAM policy below allows
      invocation of the inference profile and the underlying foundation
      models in every region the profile routes to (us-east-1, us-east-2,
      us-west-2). For a single-region foundation-model id, narrow the
      Resource list manually after stack creation.

  CreateInstanceProfile:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to 'false' if you don't plan to run the validator on EC2.

  CreateVpc:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create a small private VPC with two private subnets (no IGW), a security
      group for the validator host, and PrivateLink interface endpoints for
      Bedrock Runtime, Secrets Manager, KMS, STS, and CloudWatch Logs.
      Set to 'false' if you already have a VPC you want the validator to
      run in — in that case provision the endpoints separately.

  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
    Description: CIDR block for the VPC (used only when CreateVpc=true).

Conditions:
  WantsInstanceProfile: !Equals [!Ref CreateInstanceProfile, 'true']
  WantsVpc: !Equals [!Ref CreateVpc, 'true']

Resources:

  # ------------------------------------------------------------------------
  # KMS CMK for Secrets Manager encryption (CKV_AWS_149)
  # ------------------------------------------------------------------------
  SecretsKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'CMK for ${ProjectName} Secrets Manager secrets'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  SecretsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}/secrets'
      TargetKeyId: !Ref SecretsKmsKey

  # ------------------------------------------------------------------------
  # Secrets Manager scaffolding (always created)
  # ------------------------------------------------------------------------
  SourceSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/source'
      Description: SQL Server source connection details (populate after stack creation).
      KmsKeyId: !GetAtt SecretsKmsKey.Arn
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Role, Value: source }

  TargetSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/target'
      Description: PostgreSQL target connection details (populate after stack creation).
      KmsKeyId: !GetAtt SecretsKmsKey.Arn
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Role, Value: target }

  # ------------------------------------------------------------------------
  # Optional private VPC + interface endpoints
  # ------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: WantsVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-vpc' }
        - { Key: Project, Value: !Ref ProjectName }

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Condition: WantsVpc
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: REJECT
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Sub '/aws/${ProjectName}/vpc-flow-logs'
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  VpcFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: WantsVpc
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: Flow logs are non-sensitive network metadata; CMK encryption not required for this sample.
    Properties:
      LogGroupName: !Sub '/aws/${ProjectName}/vpc-flow-logs'
      RetentionInDays: 14

  FlowLogRole:
    Type: AWS::IAM::Role
    Condition: WantsVpc
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/${ProjectName}/vpc-flow-logs*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  SubnetA:
    Type: AWS::EC2::Subnet
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-private-a' }
        - { Key: Project, Value: !Ref ProjectName }

  SubnetB:
    Type: AWS::EC2::Subnet
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-private-b' }
        - { Key: Project, Value: !Ref ProjectName }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-private-rt' }
        - { Key: Project, Value: !Ref ProjectName }

  SubnetARouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: WantsVpc
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PrivateRouteTable

  SubnetBRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: WantsVpc
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Security group for the validator host. Egress is intentionally narrow:
  # only HTTPS (for the AWS PrivateLink endpoints below), and traffic to the
  # databases (you'll need to peer / VPN to reach them from this VPC).
  ValidatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Egress for the migration validator host.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS to interface endpoints inside this VPC.
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-validator-sg' }
        - { Key: Project, Value: !Ref ProjectName }

  # SG used by the interface endpoints — accepts HTTPS from the validator SG.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WantsVpc
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: Egress restricted to VPC CIDR for endpoint responses.
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Inbound HTTPS from validator hosts to PrivateLink endpoints.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ValidatorSecurityGroup
          Description: HTTPS from validator host SG.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS responses within VPC.
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-endpoint-sg' }
        - { Key: Project, Value: !Ref ProjectName }

  # Interface endpoints — keep AWS API traffic on the AWS network.
  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  KmsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: WantsVpc
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # ------------------------------------------------------------------------
  # IAM role for the validator host
  # ------------------------------------------------------------------------
  ValidatorRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Explicit role name required for cross-stack references and operational clarity.
    Properties:
      RoleName: !Sub '${ProjectName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref SourceSecret
                  - !Ref TargetSecret
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !GetAtt SecretsKmsKey.Arn
        - PolicyName: InvokeBedrockModel
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ApplyGuardrail
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
        - PolicyName: WriteLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/${ProjectName}*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  ValidatorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: WantsInstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-instance-profile'
      Roles:
        - !Ref ValidatorRole

  ValidatorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/${ProjectName}'
      RetentionInDays: 14
      KmsKeyId: !GetAtt LogsKmsKey.Arn

  LogsKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'CMK for ${ProjectName} CloudWatch Logs encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/${ProjectName}*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

Outputs:
  SourceSecretArn:
    Description: ARN of the empty source secret (populate it next).
    Value: !Ref SourceSecret
    Export:
      Name: !Sub '${ProjectName}-source-secret-arn'
  TargetSecretArn:
    Description: ARN of the empty target secret (populate it next).
    Value: !Ref TargetSecret
    Export:
      Name: !Sub '${ProjectName}-target-secret-arn'
  ValidatorRoleArn:
    Description: IAM role to assume when running the validator.
    Value: !GetAtt ValidatorRole.Arn
    Export:
      Name: !Sub '${ProjectName}-role-arn'
  VpcId:
    Description: VPC id (only when CreateVpc=true).
    Value: !If [WantsVpc, !Ref Vpc, 'not-created']
  PrivateSubnetIds:
    Description: Private subnet ids (only when CreateVpc=true).
    Value: !If
      - WantsVpc
      - !Sub '${SubnetA},${SubnetB}'
      - 'not-created'
  ValidatorSecurityGroupId:
    Description: Attach this SG to your EC2/ECS validator host (only when CreateVpc=true).
    Value: !If [WantsVpc, !Ref ValidatorSecurityGroup, 'not-created']
  PopulateSecretsCmd:
    Description: Sample CLI to populate the secrets after the stack is created.
    Value: !Sub |
      aws secretsmanager put-secret-value --secret-id ${ProjectName}/source --secret-string '{"host":"...","port":1433,"database":"...","username":"...","password":"..."}' && \
      aws secretsmanager put-secret-value --secret-id ${ProjectName}/target --secret-string '{"host":"...","port":5432,"database":"...","username":"...","password":"..."}'
