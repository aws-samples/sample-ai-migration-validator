[project]
name = "migration-validator"
version = "0.1.0"
description = "Agentic validator for SQL Server → PostgreSQL migrations (AWS Sample)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-0" }
authors = [{ name = "Amazon Web Services" }]
keywords = ["aws", "bedrock", "strands", "mcp", "sqlserver", "postgresql", "migration", "validator", "agentic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "mcp>=1.2.0",
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-tds>=1.16.0",
    "psycopg[binary]>=3.1.18",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "mypy>=1.10.0",
]

[project.scripts]
migration-validator = "migration_validator.__main__:cli"

[project.urls]
Homepage = "https://github.com/aws-samples/sql-to-postgres-migration-validator"
Issues = "https://github.com/aws-samples/sql-to-postgres-migration-validator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_validator"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "mcp_servers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "RUF"]
ignore = [
    "S101",  # asserts in tests are fine
    "S608",  # we build SQL via parameterized helpers; raw construction is reviewed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"mcp_servers/**" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
# B101: assert is fine in tests.
# B105: '***' is a redaction placeholder, not a credential.
# B110: ``except: pass`` during shutdown — close failures are non-fatal.
# B112: best-effort sampling loop intentionally swallows per-table errors.
# B608: every f-string SQL builder validates identifiers via _safe_ident().
skips = ["B101", "B105", "B110", "B112", "B608"]
exclude_dirs = ["tests", ".venv"]
